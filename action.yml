name: Loose Ends Check
description: Graph-powered liveness checks for AI-written code. Fails when a pull request leaves orphaned, superseded, or unconnected code.
author: Siddharth Nashikkar
branding:
  icon: git-merge
  color: orange
inputs:
  working-directory:
    description: Project root inside the repository.
    default: "."
  base:
    description: Base revision. Defaults to the pull request base, or the merge base with the default branch.
    default: ""
  fail-on:
    description: Comma-separated finding kinds that fail the job. Defaults to the project config.
    default: ""
  fail:
    description: Set to "false" to report findings without failing the job.
    default: "true"
  annotations:
    description: Add inline annotations to the pull request diff.
    default: "true"
  comment:
    description: 'Sticky pull request comment: "on-findings", "always", or "never". Needs pull-requests: write.'
    default: on-findings
  sarif:
    description: Path to write a SARIF report for code scanning. Empty to skip.
    default: ""
  github-token:
    description: Token used to post the pull request comment.
    default: ${{ github.token }}
outputs:
  passed:
    description: '"true" when no blocking findings were found.'
  findings:
    description: Number of unsuppressed findings.
  blocking:
    description: Number of blocking findings.
  sarif:
    description: Path of the SARIF report, when written.
runs:
  using: node24
  main: action/index.mjs
